<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f6f3f8;
      font-family: system-ui, sans-serif;
      color: #4a2d55;
    }
    h1 { margin-bottom: 0; }
    p { margin: 4px 0 0; font-style: italic; color: #7a5a86; }
    svg { width: min(80vw, 380px); height: auto; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>Vanda Miss Joaquim</p>
  <svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Vanda Miss Joaquim orchid: mauve petals with purple speckles and a deep magenta lip, on a green spike with buds and strap leaves">
    <defs>
      <radialGradient id="petal" cx="50%" cy="60%" r="65%">
        <stop offset="0%" stop-color="#b86ccf"/>
        <stop offset="100%" stop-color="#e6c6f0"/>
      </radialGradient>
      <radialGradient id="lip" cx="50%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#b0289a"/>
        <stop offset="100%" stop-color="#6e1566"/>
      </radialGradient>
      <g id="spots" fill="#6a1b8a" opacity="0.7">
        <circle cx="-8" cy="-6" r="1.6"/><circle cx="4" cy="-10" r="1.4"/>
        <circle cx="10" cy="2" r="1.6"/><circle cx="-2" cy="4" r="1.3"/>
        <circle cx="-12" cy="8" r="1.4"/><circle cx="6" cy="12" r="1.5"/>
        <circle cx="-4" cy="-18" r="1.3"/><circle cx="14" cy="-8" r="1.2"/>
        <circle cx="-14" cy="-2" r="1.2"/><circle cx="0" cy="16" r="1.3"/>
      </g>
    </defs>

    <!-- strap leaves -->
    <path d="M148 330 C110 320 70 330 30 365 C80 350 120 348 150 352 Z" fill="#3f8f4a"/>
    <path d="M152 330 C190 318 235 325 275 358 C225 346 185 346 150 352 Z" fill="#4caf5a"/>
    <path d="M150 300 C120 285 90 285 60 300 C95 300 125 305 150 318 Z" fill="#4caf5a"/>

    <!-- spike -->
    <path d="M150 170 C146 230 154 290 150 352" stroke="#3f8f4a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- aerial roots -->
    <path d="M150 335 C140 355 128 366 120 378" stroke="#b9c9a8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M152 338 C162 356 172 368 182 378" stroke="#b9c9a8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- buds -->
    <path d="M150 250 C165 245 172 235 176 224" stroke="#3f8f4a" stroke-width="3" fill="none"/>
    <ellipse cx="177" cy="219" rx="8" ry="11" fill="#d7a9e6" stroke="#b673c9" transform="rotate(20 177 219)"/>
    <path d="M150 285 C136 280 128 270 124 260" stroke="#3f8f4a" stroke-width="3" fill="none"/>
    <ellipse cx="123" cy="255" rx="6" ry="9" fill="#e3c4ee" stroke="#b673c9" transform="rotate(-20 123 255)"/>

    <!-- lateral sepals (lower) -->
    <g transform="translate(150 125)" stroke="#a45bbd" stroke-width="1.2" fill="url(#petal)">
      <g transform="rotate(28)"><ellipse cx="0" cy="52" rx="26" ry="42"/><use href="#spots" transform="translate(0 52)"/></g>
      <g transform="rotate(-28)"><ellipse cx="0" cy="52" rx="26" ry="42"/><use href="#spots" transform="translate(0 52)"/></g>
    </g>

    <!-- dorsal sepal (top) -->
    <g transform="translate(150 125)" stroke="#a45bbd" stroke-width="1.2" fill="url(#petal)">
      <ellipse cx="0" cy="-50" rx="30" ry="44"/><use href="#spots" transform="translate(0 -50)"/>
    </g>

    <!-- petals (sides, broad and rounded) -->
    <g transform="translate(150 125)" stroke="#a45bbd" stroke-width="1.2" fill="url(#petal)">
      <g transform="rotate(-80)"><ellipse cx="0" cy="-50" rx="34" ry="42"/><use href="#spots" transform="translate(0 -50)"/></g>
      <g transform="rotate(80)"><ellipse cx="0" cy="-50" rx="34" ry="42"/><use href="#spots" transform="translate(0 -50)"/></g>
    </g>

    <!-- lip (labellum): side lobes + midlobe -->
    <path d="M150 128 C128 120 116 132 122 150 C130 160 142 160 150 152 Z" fill="url(#lip)"/>
    <path d="M150 128 C172 120 184 132 178 150 C170 160 158 160 150 152 Z" fill="url(#lip)"/>
    <path d="M150 140 C128 156 126 184 150 208 C174 184 172 156 150 140 Z" fill="url(#lip)" stroke="#5a0f55" stroke-width="1"/>
    <!-- orange/yellow throat -->
    <ellipse cx="150" cy="140" rx="13" ry="10" fill="#f6a43a"/>
    <ellipse cx="150" cy="136" rx="7" ry="5" fill="#ffd36b"/>
    <!-- column -->
    <ellipse cx="150" cy="124" rx="8" ry="9" fill="#fff4e6" stroke="#d9c3a5"/>
    <circle cx="150" cy="122" r="2.5" fill="#e9b872"/>
  </svg>
</body>
</html>
